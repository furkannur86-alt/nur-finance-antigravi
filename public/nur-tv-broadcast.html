<title>NUR TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#060810;--surface:#0c1420;--surface2:#111827;--surface3:#1a2235;
  --amber:#C8882A;--amber-b:#E8A040;--amber-d:#7A5018;
  --cyan:#00C4D0;--cyan-d:#005a60;
  --crimson:#C41E1E;--crimson-d:#6b1010;
  --text:#E2DDD4;--text-dim:#8a8580;--text-muted:#4a4a55;
  --green:#22c55e;--red:#ef4444;
  --border:rgba(200,136,42,0.18);--border-c:rgba(0,196,208,0.2);
}
html,body{height:100%;background:var(--void);color:var(--text);font-family:'Barlow',sans-serif;overflow:hidden;font-variant-numeric:tabular-nums}

/* SHELL */
#shell{display:flex;flex-direction:column;height:100vh;position:relative}
#three-canvas{position:absolute;inset:0;z-index:0;width:100%!important;height:100%!important}
#scanlines{position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px)}
#ui{position:relative;z-index:2;display:flex;flex-direction:column;height:100%}

/* TOP BAR */
#top{display:flex;align-items:center;gap:12px;padding:8px 16px;background:rgba(6,8,16,0.92);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;margin-right:4px}
.logo-box{width:32px;height:32px;background:linear-gradient(135deg,var(--amber),var(--amber-b));border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;color:#000;flex-shrink:0}
.logo-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:17px;letter-spacing:.08em;color:var(--amber-b);text-transform:uppercase;line-height:1}
.logo-sub{font-size:8px;letter-spacing:.22em;color:var(--text-muted);text-transform:uppercase;line-height:1;margin-top:2px}
.live{display:flex;align-items:center;gap:4px;background:var(--crimson);padding:2px 7px;border-radius:2px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:.14em;color:#fff;text-transform:uppercase;flex-shrink:0}
.live-dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1s steps(1) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.ch-tabs{display:flex;gap:3px}
.ch{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);color:var(--text-dim);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.05em;padding:4px 10px;border-radius:3px;cursor:pointer;transition:all .12s;white-space:nowrap}
.ch:hover{background:rgba(200,136,42,0.1);color:var(--amber-b);border-color:var(--amber-d)}
.ch.active{background:linear-gradient(135deg,rgba(200,136,42,0.22),rgba(200,136,42,0.08));border-color:var(--amber);color:var(--amber-b)}
/* Camera angle buttons */
.cam-tabs{display:flex;gap:3px}
.cam{background:rgba(0,196,208,0.06);border:1px solid rgba(0,196,208,0.12);color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:9px;letter-spacing:.08em;padding:3px 8px;border-radius:3px;cursor:pointer;transition:all .12s;white-space:nowrap;text-transform:uppercase}
.cam:hover{color:var(--cyan);border-color:var(--border-c)}
.cam.active{background:rgba(0,196,208,0.15);border-color:var(--cyan);color:var(--cyan)}
.clocks{display:flex;gap:14px;flex-shrink:0}
.clk{text-align:center}
.clk-city{font-size:8px;letter-spacing:.16em;color:var(--text-muted);text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;font-weight:600}
.clk-t{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:var(--cyan);letter-spacing:.03em}
.lang-sel{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:.05em;padding:3px 7px;border-radius:3px;cursor:pointer;outline:none}
.ctrl{width:28px;height:28px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);border-radius:3px;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .12s;flex-shrink:0}
.ctrl:hover{background:rgba(0,196,208,0.14);color:var(--cyan);border-color:var(--border-c)}
.ctrl.on{background:rgba(0,196,208,0.18);color:var(--cyan);border-color:var(--cyan)}
/* Audio status pill */
.audio-pill{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,0.5);border:1px solid rgba(200,136,42,0.25);border-radius:20px;padding:3px 10px;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:600;letter-spacing:.06em;color:var(--text-dim);white-space:nowrap;cursor:pointer;transition:all .12s;flex-shrink:0}
.audio-pill:hover{border-color:var(--amber);color:var(--amber-b)}
.audio-pill.playing{border-color:var(--cyan);color:var(--cyan);background:rgba(0,196,208,0.08)}
.audio-bars{display:flex;align-items:center;gap:1px;height:12px}
.ab{width:2px;background:currentColor;border-radius:1px;height:3px}
.playing .ab:nth-child(1){animation:aw .8s ease-in-out 0s infinite}
.playing .ab:nth-child(2){animation:aw .8s ease-in-out .13s infinite}
.playing .ab:nth-child(3){animation:aw .8s ease-in-out .26s infinite}
.playing .ab:nth-child(4){animation:aw .8s ease-in-out .39s infinite}
.playing .ab:nth-child(5){animation:aw .8s ease-in-out .52s infinite}
@keyframes aw{0%,100%{height:2px}50%{height:11px}}

/* MAIN */
#main{display:flex;flex:1;min-height:0}
#center{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#studio-wrap{flex:1;min-height:0;position:relative;overflow:hidden}
#three-local{width:100%;height:100%;display:block}
/* CG OVERLAY */
#cg{position:absolute;inset:0;pointer-events:none}
#cg-canvas{width:100%;height:100%;display:block}

/* Spiker button */
#spiker{position:absolute;top:12px;left:14px;pointer-events:all;display:flex;align-items:center;gap:7px;background:rgba(6,8,16,0.8);border:1px solid var(--amber-d);border-radius:5px;padding:5px 11px;cursor:pointer;transition:all .13s;color:var(--text-dim);font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:.07em;backdrop-filter:blur(10px)}
#spiker:hover{border-color:var(--amber);color:var(--amber-b);background:rgba(200,136,42,0.1)}
#spiker.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,196,208,0.1)}
.sw{display:flex;align-items:center;gap:1px;height:12px}
.sb{width:2px;background:currentColor;border-radius:1px;height:3px}
.on .sb:nth-child(1){animation:aw .7s ease-in-out 0s infinite}
.on .sb:nth-child(2){animation:aw .7s ease-in-out .1s infinite}
.on .sb:nth-child(3){animation:aw .7s ease-in-out .2s infinite}
.on .sb:nth-child(4){animation:aw .7s ease-in-out .3s infinite}
.on .sb:nth-child(5){animation:aw .7s ease-in-out .4s infinite}

/* ElevenLabs badge */
#el-badge{position:absolute;top:12px;right:14px;pointer-events:all;display:flex;align-items:center;gap:6px;background:rgba(6,8,16,0.75);border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:4px 10px;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:600;letter-spacing:.1em;color:var(--text-muted);backdrop-filter:blur(8px);cursor:pointer;transition:all .13s}
#el-badge:hover{border-color:var(--cyan);color:var(--cyan)}
#el-badge.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,196,208,0.08)}
.el-dot{width:5px;height:5px;border-radius:50%;background:var(--cyan)}
.active .el-dot{animation:blink .8s steps(1) infinite}

/* BREAKING BAND */
#breaking{background:var(--crimson);height:25px;display:flex;align-items:center;overflow:hidden;flex-shrink:0}
.brk-label{background:#7a0f0f;padding:0 12px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10px;letter-spacing:.18em;color:#fff;white-space:nowrap;height:100%;display:flex;align-items:center;flex-shrink:0}
.brk-wrap{flex:1;overflow:hidden;height:100%;display:flex;align-items:center}
.brk-scroll{white-space:nowrap;animation:scrollL 50s linear infinite;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.02em;color:#fff}
@keyframes scrollL{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}

/* RIGHT PANEL */
#rpanel{width:210px;flex-shrink:0;background:rgba(6,8,16,0.9);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.ph{padding:8px 12px 7px;border-bottom:1px solid var(--border);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:9px;letter-spacing:.2em;color:var(--amber);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ph-dot{width:4px;height:4px;border-radius:50%;background:var(--cyan);animation:blink 2s steps(1) infinite}
.mlist{flex:1;overflow-y:auto;scrollbar-width:none}
.mlist::-webkit-scrollbar{display:none}
.mrow{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-bottom:1px solid rgba(255,255,255,0.025);cursor:default;transition:background .1s}
.mrow:hover{background:rgba(255,255,255,0.02)}
.ml{flex:1;min-width:0}
.msym{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;color:var(--text);line-height:1}
.mname{font-size:8px;color:var(--text-muted);margin-top:1px;line-height:1}
.mr{text-align:right;flex-shrink:0}
.mprice{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:var(--text);line-height:1}
.mchg{font-family:'JetBrains Mono',monospace;font-size:9px;margin-top:1px;line-height:1}
.pos{color:var(--green)}.neg{color:var(--red)}
.msp{width:36px;height:18px;flex-shrink:0;margin:0 7px}

/* Headlines */
#hpanel{border-top:1px solid var(--border);flex-shrink:0;padding:0 0 3px}
.hph{padding:7px 12px 5px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:9px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}
.hi{padding:5px 12px;border-bottom:1px solid rgba(255,255,255,0.025);cursor:pointer;transition:background .1s}
.hi:hover{background:rgba(0,196,208,0.03)}
.hi.active{background:rgba(0,196,208,0.05);border-left:2px solid var(--cyan);padding-left:10px}
.ht{font-size:9px;line-height:1.3;color:var(--text-dim)}
.hi.active .ht{color:var(--text)}
.htm{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--text-muted);margin-top:1px}

/* TICKER */
#ticker{height:28px;background:rgba(6,8,16,0.96);border-top:1px solid var(--border);display:flex;align-items:center;overflow:hidden;flex-shrink:0}
.tlogo{padding:0 11px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10px;letter-spacing:.12em;background:linear-gradient(135deg,var(--amber),var(--amber-b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;border-right:1px solid var(--border);white-space:nowrap;height:100%;display:flex;align-items:center;flex-shrink:0}
.twrap{flex:1;overflow:hidden;height:100%;display:flex;align-items:center}
.tscroll{display:flex;align-items:center;white-space:nowrap;animation:tickR 100s linear infinite}
@keyframes tickR{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ti{display:inline-flex;align-items:center;gap:4px;padding:0 16px;border-right:1px solid rgba(255,255,255,0.05);height:28px}
.tsym{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;color:var(--text);letter-spacing:.04em}
.tpr{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:500;color:var(--text)}
.tch{font-family:'JetBrains Mono',monospace;font-size:8px}
.tctrl{display:flex;align-items:center;gap:3px;padding:0 8px;border-left:1px solid var(--border);height:100%;flex-shrink:0}

/* Audio mode badge */
.audio-mode{font-family:'Barlow Condensed',sans-serif;font-size:8px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;padding:2px 6px;border:1px solid rgba(255,255,255,0.07);border-radius:2px}
</style>

  <div id="ui">

      <button class="ctrl" onclick="toggleFS()">⛶</button>

    <!-- MAIN -->
    <div id="main">
      <!-- CENTER STUDIO -->
      <div id="center">
        <div id="studio-wrap">
          <canvas id="three-local"></canvas>
          <!-- CG 2D overlay -->
          <canvas id="cg-canvas" style="position:absolute;inset:0;pointer-events:none"></canvas>

          <!-- AI Spiker -->
          <button id="spiker" onclick="toggleSpiker()">
            <div class="sw"><div class="sb"></div><div class="sb"></div><div class="sb"></div><div class="sb"></div><div class="sb"></div></div>
            <span id="spikerLabel">AI Spiker: Standby</span>

          <!-- ElevenLabs badge -->
          <div id="el-badge" onclick="cycleAudioMode()">
            <div class="el-dot"></div>
            <span id="elLabel">ElevenLabs · Ambient</span>
          </div>
        </div>

        <!-- Breaking band -->
        <div id="breaking">
          <div class="brk-label" id="brkLabel">SON DAKİKA</div>
          <div class="brk-wrap"><div class="brk-scroll" id="brkScroll">Yükleniyor...</div></div>
        </div>
      </div>

      <!-- RIGHT PANEL -->
      <div id="rpanel">
        <div class="ph">Piyasa Verileri<div class="ph-dot"></div></div>
        <div class="mlist" id="mlist"></div>
        <div id="hpanel">
          <div class="hph">Manşetler</div>
          <div id="hlist"></div>
        </div>
      </div>
    </div>

    <!-- TICKER -->
    <div id="ticker">
      <div class="tlogo">NUR FINANCE</div>
      <div class="twrap"><div class="tscroll" id="tscroll"></div></div>
      <div class="tctrl">
        <span class="audio-mode" id="audioMode">🎵 AMBIENT</span>
        <button class="ctrl" onclick="toggleTicker()" id="tpBtn">⏸</button>
      </div>
    </div>
  </div>
</div>

function roundRect(c,x,y,w,h,r){
  c.beginPath(); c.moveTo(x+r,y); c.lineTo(x+w-r,y);
  c.quadraticCurveTo(x+w,y,x+w,y+r); c.lineTo(x+w,y+h-r);
  c.quadraticCurveTo(x+w,y+h,x+w-r,y+h); c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r); c.lineTo(x,y+r);
  c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}

// ─── ANIMATION LOOP ───────────────────────────────────────────────────────────
let t0=null,prevT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!t0)t0=ts;
  const t=ts-t0, dt=ts-prevT; prevT=ts;

  // Smooth camera transition
  const spd=0.04;
  camCurrent.pos=lerpArr(camCurrent.pos,camTarget.pos,spd);
  camCurrent.look=lerpArr(camCurrent.look,camTarget.look,spd);
  camera.position.set(...camCurrent.pos);
  camera.lookAt(...camCurrent.look);

  // Pulsing screen glow
  const pulse=0.7+0.15*Math.sin(t*0.001);
  screenLight2.intensity=1.2*pulse;
  deskLight.intensity=1.5+0.3*Math.sin(t*0.0008);
  lensDust.rotation.y=t*0.00004;
  lensMat.opacity=0.25+0.15*Math.sin(t*0.0007);

  // Spotlight flicker (very subtle)
  spotLights.forEach((sl,i)=>{sl.intensity=2.3+0.15*Math.sin(t*0.0003+i*0.7);});

  drawScreens(t);
  renderer.render(scene,camera);
  drawCG(t);
}
requestAnimationFrame(loop);

// ─── MARKET DATA ─────────────────────────────────────────────────────────────
function sparkSVG(vals,pos){
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*34+1},${17-((v-mn)/rng)*15}`).join(' ');
  const col=pos?'#22c55e':'#ef4444';
  const fc=pos?'rgba(34,197,94,0.12)':'rgba(239,68,68,0.12)';
  const last=pts.split(' ').pop().split(',');
  const poly=`${pts} ${last[0]},17 1,17`;
  return `<polygon points="${poly}" fill="${fc}"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function fmtPr(p,sym){
  if(sym==='EUR/USD')return p.toFixed(4);
  if(p>10000)return p.toLocaleString('en-US',{maximumFractionDigits:0});
  return p.toFixed(2);
}
function renderMkt(){
  document.getElementById('mlist').innerHTML=MKT.map(m=>{
    const pos=m.chg>=0,cls=pos?'pos':'neg',sign=pos?'+':'';
    return `<div class="mrow">
      <div class="ml"><div class="msym">${m.sym}</div><div class="mname">${m.name}</div></div>
      <svg class="msp" viewBox="0 0 36 18">${sparkSVG(m.spark,pos)}</svg>
      <div class="mr"><div class="mprice">${fmtPr(m.price,m.sym)}</div><div class="mchg ${cls}">${sign}${m.chg.toFixed(2)}%</div></div>
    </div>`;
  }).join('');
}

function buildTicker(){
  const items=MKT.map(m=>{
    const pos=m.chg>=0,cls=pos?'pos':'neg',arr=pos?'▲':'▼';
    return `<span class="ti"><span class="tsym">${m.sym}</span><span class="tpr">${fmtPr(m.price,m.sym)}</span><span class="tch ${cls}">${arr}${Math.abs(m.chg).toFixed(2)}%</span></span>`;
  }).join('');
  const el=document.getElementById('tscroll');
  el.innerHTML=items+items;
}
function toggleTicker(){
  tickerPaused=!tickerPaused;
  document.getElementById('tscroll').style.animationPlayState=tickerPaused?'paused':'running';

// ─── WEB AUDIO ENGINE (ElevenLabs-production-note alignment) ─────────────────
// audioPackages from broadcast.ts:
//  audio-ambient: "Minimal ambient pad, 85 BPM, subtle, atmospheric"
//  audio-main-intro: "Orchestral synth with driving beat, 120 BPM, Bloomberg TV meets Hans Zimmer"
//  audio-breaking: "Sharp brass hit with tension build, 140 BPM"
function ensureAudio(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function stopAudio(){
  if(ambientNodes.gainNode){try{ambientNodes.gainNode.gain.setTargetAtTime(0,audioCtx.currentTime,0.3);}catch(e){}
  setTimeout(()=>{try{for(const k of Object.keys(ambientNodes)){ambientNodes[k].stop&&ambientNodes[k].stop();}ambientNodes={};}catch(e){}},500);}
  audioPlaying=false;
  document.getElementById('audioPill').classList.remove('playing');
  document.getElementById('el-badge').classList.remove('active');
}
function playAmbient(){
  // "Studio Ambient Loop" — 85 BPM, A minor pads
  ensureAudio();
  const gain=audioCtx.createGain(); gain.gain.value=0; gain.connect(audioCtx.destination);
  gain.gain.setTargetAtTime(0.12,audioCtx.currentTime,1.5);
  const oscs=[]; const freqs=[220,330,440,550,660];
  freqs.forEach((f,i)=>{
    const o=audioCtx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=audioCtx.createGain(); g.gain.value=0.08/(i+1);
    const lfo=audioCtx.createOscillator(); lfo.frequency.value=0.06+i*0.02;
    const lgain=audioCtx.createGain(); lgain.gain.value=0.03;
    lfo.connect(lgain); lgain.connect(g.gain); lfo.start();
    o.connect(g); g.connect(gain); o.start();
    oscs.push(o,lfo);
  });
  // Subtle noise pad
  const bufLen=audioCtx.sampleRate*2; const buf=audioCtx.createBuffer(1,bufLen,audioCtx.sampleRate);
  const data=buf.getChannelData(0); for(let i=0;i<bufLen;i++)data[i]=(Math.random()*2-1)*0.05;
  const src=audioCtx.createBufferSource(); src.buffer=buf; src.loop=true;
  const filt=audioCtx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=400; filt.Q.value=0.8;
  const ng=audioCtx.createGain(); ng.gain.value=0.08;
  src.connect(filt); filt.connect(ng); ng.connect(gain); src.start();
  ambientNodes={gainNode:gain,oscs,noiseSrc:src};
  audioPlaying=true;
  document.getElementById('audioPill').classList.add('playing');
  document.getElementById('el-badge').classList.add('active');
}
function playIntro(){
  // "NUR Finance Main Theme" — 120 BPM, orchestral synth, confident
  ensureAudio();
  const gain=audioCtx.createGain(); gain.gain.value=0; gain.connect(audioCtx.destination);
  gain.gain.setTargetAtTime(0.18,audioCtx.currentTime,0.4);
  const notes=[
    {f:293.66,t:0,dur:0.5},{f:329.63,t:0.5,dur:0.5},{f:392.00,t:1.0,dur:0.5},
    {f:440.00,t:1.5,dur:0.5},{f:392.00,t:2.0,dur:0.3},{f:349.23,t:2.3,dur:0.3},
    {f:440.00,t:2.6,dur:1.0},{f:523.25,t:4.0,dur:0.5},{f:587.33,t:4.5,dur:0.5},
    {f:659.25,t:5.0,dur:0.5},{f:698.46,t:5.5,dur:0.5},{f:783.99,t:6.0,dur:1.5},
  ];
  const oscs=[];
  notes.forEach(n=>{
    const o=audioCtx.createOscillator(); o.type='sawtooth'; o.frequency.value=n.f;
    const og=audioCtx.createGain(); og.gain.value=0;
    const og2=audioCtx.createGain(); og2.gain.value=0.35;
    const filt=audioCtx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=2200;
    o.connect(filt); filt.connect(og); og.connect(og2); og2.connect(gain);
    const st=audioCtx.currentTime+n.t;
    og.gain.setValueAtTime(0,st); og.gain.linearRampToValueAtTime(0.7,st+0.05);
    og.gain.setValueAtTime(0.7,st+n.dur-0.05); og.gain.linearRampToValueAtTime(0,st+n.dur);
    o.start(st); o.stop(st+n.dur+0.1); oscs.push(o);
  });
  // Bass drone
  const bass=audioCtx.createOscillator(); bass.type='sine'; bass.frequency.value=73.42;
  const bg=audioCtx.createGain(); bg.gain.value=0.25; bass.connect(bg); bg.connect(gain); bass.start();
  ambientNodes={gainNode:gain,oscs:[...oscs,bass]};
  audioPlaying=true;
  document.getElementById('audioPill').classList.add('playing');
  document.getElementById('el-badge').classList.add('active');
  setTimeout(()=>{stopAudio();audioModeIdx=0;document.getElementById('audioMode').textContent='🎵 AMBIENT';document.getElementById('audioPillLabel').textContent='Studio Ambient';},8500);
}
function playBreaking(){
  // "Breaking News Sting" — 140 BPM, sharp brass, 5 sec
  ensureAudio();
  const gain=audioCtx.createGain(); gain.gain.value=0; gain.connect(audioCtx.destination);
  gain.gain.setTargetAtTime(0.22,audioCtx.currentTime,0.05);
  const hits=[{f:880,t:0,dur:0.15},{f:1046,t:0.18,dur:0.15},{f:1318,t:0.36,dur:0.15},{f:1568,t:0.54,dur:0.3},{f:1318,t:0.9,dur:0.15},{f:1568,t:1.1,dur:0.9}];
  const oscs=[];
  hits.forEach(h=>{
    const o=audioCtx.createOscillator(); o.type='square'; o.frequency.value=h.f;
    const og=audioCtx.createGain(); og.gain.value=0;
    const filt=audioCtx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=h.f*1.1; filt.Q.value=2;
    o.connect(filt); filt.connect(og); og.connect(gain);
    const st=audioCtx.currentTime+h.t;
    og.gain.setValueAtTime(0,st); og.gain.linearRampToValueAtTime(0.8,st+0.02);
    og.gain.setValueAtTime(0.8,st+h.dur-0.04); og.gain.linearRampToValueAtTime(0,st+h.dur);
    o.start(st); o.stop(st+h.dur+0.15); oscs.push(o);
  });
  // Tension noise sweep
  const bufLen=audioCtx.sampleRate*2.5; const buf=audioCtx.createBuffer(1,bufLen,audioCtx.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<bufLen;i++)d[i]=(Math.random()*2-1)*0.4;
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const f=audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=800; f.Q.value=1.5;
  const sg=audioCtx.createGain(); sg.gain.value=0; sg.gain.linearRampToValueAtTime(0.15,audioCtx.currentTime+2);
  sg.gain.linearRampToValueAtTime(0,audioCtx.currentTime+2.5);
  src.connect(f); f.connect(sg); sg.connect(gain); src.start();
  ambientNodes={gainNode:gain,oscs};
  audioPlaying=true;
  document.getElementById('audioPill').classList.add('playing');
  document.getElementById('el-badge').classList.add('active');
  setTimeout(()=>{stopAudio();audioModeIdx=0;document.getElementById('audioMode').textContent='🎵 AMBIENT';document.getElementById('audioPillLabel').textContent='Studio Ambient';},5000);
}

function toggleAudio(){
  if(audioPlaying){stopAudio();return;}
  if(audioModeIdx===0)playAmbient();
  else if(audioModeIdx===1)playIntro();
  else playBreaking();
}
function cycleAudioMode(){
  stopAudio();
  audioModeIdx=(audioModeIdx+1)%3;
  const modes=['🎵 AMBIENT','🎺 INTRO','⚡ BREAKING'];
  const labels=['Studio Ambient','NUR Finance Intro','Breaking Sting'];
  const elLabels=['ElevenLabs · Ambient','ElevenLabs · Intro','ElevenLabs · Breaking'];
  document.getElementById('audioMode').textContent=modes[audioModeIdx];
  document.getElementById('audioPillLabel').textContent=labels[audioModeIdx];
  document.getElementById('elLabel').textContent=elLabels[audioModeIdx];
}
